name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes:
    name: hermes plugins validate (${{ matrix.hermes.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hermes:
          - name: v0.22.2
            sha: d923a5eb487a17c0a68801bba9ef0f56c81040a8
          - name: v0.23.0
            sha: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes.sha }}
          path: hermes
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # uv, not pip: pip cannot resolve some Hermes releases' pins (0.23.0's Pillow vs browser-harness).
      - name: Install Hermes
        run: |
          python -m pip install uv==0.12.3
          python -m uv pip install --system -e "./hermes[mcp]"
      - name: Validate the package
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes plugins validate ./plugin --install-deps
